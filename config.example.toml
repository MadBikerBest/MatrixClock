# ════════════════════════════════════════════════════════════════════════════
#  MatrixClock — файл настроек
# ════════════════════════════════════════════════════════════════════════════
#  Где ищется (берётся первый найденный):
#    1. путь из ключа  --config <файл>
#    2. ~/.config/matrixclock/config.toml
#    3. /etc/matrixclock/config.toml
#  Если нет ни 2, ни 3 (и не задан --config), при первом запуске создаётся
#  файл 2 с этим содержимым (кроме запуска от root).
#  Любой параметр можно удалить — тогда действует значение по умолчанию,
#  указанное здесь. Опечатка в имени параметра — ошибка при запуске (а не
#  молчаливое игнорирование). Полный пример: matrixclock --print-config
# ════════════════════════════════════════════════════════════════════════════

[general]
# Через сколько минут без ввода включается скринсейвер. Используется
# фоновыми режимами (--daemon в X, служба консоли --console-daemon) и tmux
# (matrixclock --idle-seconds).
idle_minutes = 5   # 1–1440

# Режим текстовой отрисовки (графика в X выбирается сама):
#   "auto" — голая консоль Linux (TERM=linux) → "lite", всё остальное → "full"
#   "full" — 24-битный цвет, катакана, свечение. Для X-терминалов и SSH из них.
#   "lite" — 16 цветов, только ASCII. Для голой консоли: палитра консоли
#            на время работы перепрограммируется в оттенки основного цвета.
mode = "auto"

# Язык даты и погоды:
#   "auto" — по локали системы (LC_ALL, LC_MESSAGES, LANG): ru_*, de_*, fr_* —
#            русский, немецкий, французский; любая другая — английский
#   "ru", "en", "de", "fr" — всегда этот язык
language = "auto"


[clock]
# Формат: 24 или 12 часов (без AM/PM).
hours = 24
# Показывать секунды (ЧЧ:ММ:СС). Цифры станут мельче — их больше.
seconds = false
# Мигать двоеточием раз в секунду.
blink_colon = true

# ── Размер и положение ──
# Ширина часов — доля ширины экрана.
size = 0.8         # 0.1–1.0
# Предел по высоте — доля высоты экрана. Часы масштабируются так, чтобы
# уложиться и в size, и в max_height (сохраняя пропорции).
max_height = 0.62  # 0.1–1.0
# Центр часов на экране: 0.0 — левый/верхний край, 1.0 — правый/нижний.
position_x = 0.5   # 0.0–1.0
position_y = 0.45  # 0.0–1.0

# ── Начертание цифр ──
# Толщина линий цифр (множитель): 0.6 — тонкие, 1.0 — как на картинке, 1.6 — жирные.
thickness = 1.0    # 0.5–2.0
# Расстояние между цифрами (множитель): 0 — вплотную, 1.0 — обычное.
spacing = 1.0      # 0.0–3.0


[weather]
# Над часами: место, погода и температура (Open-Meteo, обновление раз в 15 мин).
# Под часами — дата. Нет интернета — строка над часами не выводится.
# Место — название города (можно уточнить: "Париж, Техас"). Пусто — город
# определяется по IP (ipwho.is) и записывается сюда при первом успешном запросе.
location = ""


[rain]
# ── Частицы ──
# Плотность: сколько струй в среднем приходится на одну колонку экрана.
#   0.2 — редкий дождь, 0.6 — как в фильме, 1.5 — ливень.
density = 0.6      # 0.0–5.0
# Скорость падения, символов в секунду.
speed = 14.0       # 1–200
# Разброс скорости между струями: 0 — все падают одинаково,
# 0.5 — от 0.5×speed до 1.5×speed.
speed_spread = 0.4 # 0.0–0.9
# Средняя длина хвоста струи, символов.
length = 14        # 1–200
# Разброс длины хвоста (аналогично speed_spread).
length_spread = 0.5  # 0.0–0.9
# Яркость дождя (множитель). Уменьшите, чтобы цифры сильнее выделялись.
brightness = 0.85  # 0.1–1.0
# Мерцание: сколько процентов символов на экране сменяется за секунду.
flicker = 20.0     # 0–100

# ── Символы ──
# Набор символов:
#   "matrix" — полуширинная катакана + цифры, как в фильме. Нужен шрифт
#              с катаканой (Arch: пакет noto-fonts-cjk), иначе будут квадратики.
#              В режиме "lite" автоматически заменяется на "ascii".
#   "ascii"  — латиница, цифры, знаки
#   "digits" — только цифры 0–9
#   "binary" — 0 и 1
#   любая другая строка — используются её символы, например "01ABCDEF".
charset = "matrix"


[digits]
# Рисунок цифр:
#   "round"   — округлые: дуги, круглые концы штрихов
#   "angular" — угловатые: прямые штрихи, скошенные углы; дата и погода
#               тогда пишутся угловатым шрифтом (Russo One) в тон цифрам
style = "round"

# ── Объём ──
# Глубина «выдавливания» цифр, в символах. 0 — плоские, 2–4 — как на
# картинке, 6+ — очень толстые «кирпичи».
depth = 3          # 0–10
# Куда уходит объём (где видна боковая грань):
#   "down-right", "down-left", "up-right", "up-left", "down"
depth_direction = "down-right"

# ── Свечение ──
# Радиус свечения вокруг цифр, в символах. 0 — без свечения.
glow = 3           # 0–10
# Интенсивность свечения.
glow_strength = 0.5  # 0.0–1.0

# ── Заполнение ──
# Доля знакомест внутри цифр, где виден символ: 0 — пустые «стеклянные»
# цифры, 1 — сплошь заполненные символами.
fill = 0.7         # 0.0–1.0
# Яркость символов внутри цифр.
brightness = 0.6   # 0.1–1.0
# Яркость светящейся кромки (контура) цифр. 0 — без кромки.
rim = 0.9          # 0.0–1.0

# ── Взаимодействие дождя с цифрами («обтекание») ──
#   "through" — сквозь: струи проходят через цифры и вспыхивают внутри
#   "around"  — обтекание: струи упираются в цифру и стекают по её контуру
#   "splash"  — скопление и капли: струи разбиваются о верх цифр,
#               с нижних кромок срываются капли
#   "occlude" — перекрытие: цифры непрозрачны, дождь проходит позади них
flow = "through"
# Только для "splash": интенсивность капель с нижних кромок (множитель).
drip_rate = 1.0    # 0.0–10.0


[colors]
# Цвета задаются в виде "#rrggbb".
# Основной цвет дождя и цифр.
color = "#00ff41"
# Цвет «тревоги»: с каждым неверным паролем гамма сдвигается к нему,
# после max_attempts неверных попыток — полностью в этом цвете.
alarm_color = "#ff1a1a"
# Цвет «голов» струй (самый яркий символ). Чтобы головы были такого же
# цвета, как дождь, укажите здесь то же, что в color.
head_color = "#e0ffe8"
# Цвет фона.
background = "#000000"


[console]
# ── Только текстовый режим: голая консоль и X-терминалы ──
# Частота кадров. В голой консоли отрисовка (fbcon) медленная — не завышайте.
fps = 15           # 1–60
# Отношение высоты знакоместа к ширине. Нужно, чтобы цифры не были
# сплюснутыми: у большинства шрифтов 1.8–2.2. Если «0» вытянут по
# вертикали — уменьшите, по горизонтали — увеличьте.
cell_aspect = 2.0  # 1.0–4.0
# Шрифт голой консоли Linux: имя файла из /usr/share/kbd/consolefonts
# без расширения, например "lat1-08", "cyr-sun16", "ter-v16n" (пакет
# terminus-font). Ставится штатным setfont на время работы, при выходе
# возвращается прежний. Мелкий шрифт (8×8) = больше знакомест = чётче
# цифры и гуще дождь. Пусто — не трогать.
# В X-терминалах шрифт задаётся в настройках самого терминала.
font = ""

[graphics]
# ── Только графический режим (X11): включается сам, если есть $DISPLAY ──
# Частота кадров.
fps = 60               # 1–144
# Шрифт символов дождя: путь к файлу .ttf/.otf.
# Пусто — встроенный (катакана + латиница + цифры, Noto Sans JP).
font = ""
# Высота символа дождя на экране, пикселей. Меньше — гуще и мельче дождь.
glyph_size = 26        # 8–96
# Зеркальные символы, как в фильме.
mirror_glyphs = true
# Слои дождя по глубине: дальние мельче, тусклее и медленнее — даёт объём сцены.
layers = 3             # 1–4

# ── Цифры ──
# Скругление граней (фаска), доля толщины линии: 0.1 — острые, 1.0 — «трубка».
bevel = 0.6            # 0.1–1.0
# Блики на «стекле» цифр.
specular = 0.8         # 0.0–1.0

# ── Свет ──
# Сила свечения (bloom) вокруг ярких символов и цифр.
bloom = 1.0            # 0.0–3.0
# Общая экспозиция (яркость кадра).
exposure = 1.0         # 0.2–4.0
# Затемнение углов экрана.
vignette = 0.4         # 0.0–1.0
# Отражение «мокрого пола» внизу экрана: 0 — нет пола.
reflection = 0.0       # 0.0–1.0
# Высота пола, доля высоты экрана (при reflection > 0).
floor_height = 0.2     # 0.05–0.5

[lock]
# Требовать пароль для выхода. false — просто заставка: выход по любой
# клавише или движению мыши.
enabled = true
# Сервис PAM — файл /etc/pam.d/<имя>. Шаблон: pam/matrixclock в проекте.
# Без этого файла скринсейвер откажется блокировать (иначе не разблокировать).
pam_service = "matrixclock"
# Надпись в поле ввода пароля (ASCII — для голой консоли).
prompt = "PASSWORD:"
# Сколько секунд держать поле пароля без нажатий, прежде чем вернуться к часам.
input_timeout = 10      # 1–600
# Сколько неверных паролей допускается. С каждым неверным гамма сдвигается
# к alarm_color; на последнем ввод блокируется на lockout_seconds.
max_attempts = 5        # 1–100
lockout_seconds = 60    # 0–3600
# Голая консоль: запретить переключение на другие консоли (Ctrl+Alt+F1…F12)
# на время блокировки, как "vlock -a". Требует прав: root или
#   sudo setcap cap_sys_tty_config+ep /usr/local/bin/matrixclock
lock_all_vt = false
